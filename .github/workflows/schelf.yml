name: Publish to Schelf

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Channel
        type: choice
        options: [stable, beta, nightly]
        default: stable
      notes:
        description: Release notes
        type: string
        required: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    uses: Lantharos/Sabine/.github/workflows/release-app.yml@v0.97
    with:
      sabine_version: v0.97
      rust_toolchain: "1.99"
      platforms: linux-x86_64 linux-aarch64
      linux_packages: libpipewire-0.3-dev clang
    secrets: inherit
  publish:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - uses: Lantharos/Store/publish@v1
        with:
          files: dist/**
          channel: ${{ inputs.channel }}
          notes: ${{ inputs.notes }}
