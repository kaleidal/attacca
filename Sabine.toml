[app]
id = "al.kaleid.attacca"
name = "Attacca"
version = "0.1.0"
icon = "assets/icon.svg"
publisher = "Kaleidal"
license = "MIT"
generic_name = "Music Player"
categories = ["AudioVideo", "Audio", "Player"]
keywords = ["music", "player", "playlist", "crossfade", "transitions", "equalizer"]
description = "A music player for files you own, where you decide how each song ends and how the next one begins."
cargo_manifest = "app/Cargo.toml"
mime_types = [
    "audio/flac",
    "audio/mpeg",
    "audio/mp4",
    "audio/aac",
    "audio/ogg",
    "audio/opus",
    "audio/x-vorbis+ogg",
    "audio/wav",
    "audio/x-wav",
    "audio/aiff",
    "audio/x-aiff",
    "application/x-attacca",
]

[app.extensions]
"audio/flac" = ["flac"]
"audio/mpeg" = ["mp3"]
"audio/mp4" = ["m4a", "mp4"]
"audio/aac" = ["aac"]
"audio/ogg" = ["ogg", "oga"]
"audio/opus" = ["opus"]
"audio/wav" = ["wav"]
"audio/aiff" = ["aif", "aiff"]
"application/x-attacca" = ["attacca"]

[web]
root = "ui"
dist = "ui/dist"
entry = "ui/dist/index.html"
dev_port = 5173
build = "bun run build"
local_files = true

[bindings]
path = "ui/src/lib/bindings.ts"

[sandbox]
network = false
filesystems = ["xdg-music"]
own = ["org.mpris.MediaPlayer2.attacca"]
pipewire = true
